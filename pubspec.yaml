name: care_point
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_ui: ^1.1.7

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  toastification: ^3.2.2
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  hydrated_bloc: ^11.0.0
  injectable: ^3.0.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  get_it: ^9.3.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  injectable_generator: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Schyler-Regular.ttf
        - asset: fonts/Schyler-Italic.ttf
    - family: Inter
      fonts:
        - asset: fonts/TrajanPro.ttf
        - asset: fonts/TrajanPro_Bold.ttf
          weight: 700
